# Cloudflare Pages configuration. No secrets belong in this file.
# Secrets (TURNSTILE_SECRET, MAILERLITE_API_KEY, ADMIN_BEARER_SECRET, IDENTITY_SALT_SEED)
# are set with `wrangler pages secret put <NAME>` or in the Cloudflare dashboard.

name = "moolresha-web"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01" # ⚠️ confirm: set to the date of the first deploy

# D1 database "moolresha_feedback". The binding name is `DB` because functions/_shared/env.ts
# reads `env.DB`. The database is addressed by name in `wrangler d1 execute moolresha_feedback`.
[[d1_databases]]
binding = "DB"
database_name = "moolresha_feedback"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder: replace after `wrangler d1 create moolresha_feedback`
preview_database_id = "00000000-0000-0000-0000-000000000000" # placeholder
migrations_dir = "migrations"
