name = "moolresha-content-studio"
main = "src/index.mjs"
compatibility_date = "2026-11-01"
workers_dev = false

# Create a NEW D1 database and R2 bucket exclusively for Content Studio.
# Replace placeholder identifiers before deployment.
[[d1_databases]]
binding = "STUDIO_DB"
database_name = "moolresha-content-studio"
database_id = "REPLACE_WITH_NEW_D1_DATABASE_ID"

[[r2_buckets]]
binding = "STUDIO_MEDIA"
bucket_name = "moolresha-content-media"

[vars]
STUDIO_ORIGIN = "https://studio.moolresha.com"
INSTAGRAM_REDIRECT_URI = "https://studio.moolresha.com/auth/callback"
ENABLE_INSTAGRAM_PUBLISH = "false"
INSTAGRAM_API_VERSION = "v26.0"

[triggers]
# 08:00, 13:00, 19:00 IST, converted to UTC
crons = ["30 2 * * *", "30 7 * * *", "30 13 * * *"]
