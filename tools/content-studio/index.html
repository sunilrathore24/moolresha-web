<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoolResha Content Studio</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Newsreader:wght@400;600&display=swap');
:root{font-family:Inter,system-ui;background:#faf6ef;color:#2c2620}*{box-sizing:border-box}body{margin:0}header{background:#3b3d2c;color:#faf6ef;padding:25px max(24px,calc((100vw - 1100px)/2))}h1,h2{font-family:Newsreader,Georgia,serif}h1{margin:4px 0;font-size:32px}header p{margin:0;color:#e7dcc8}main{max-width:1100px;margin:auto;padding:24px;display:grid;grid-template-columns:300px 1fr;gap:24px}section{background:#f3ece0;padding:22px;border:1px solid #e0d6c5;border-radius:10px}button{cursor:pointer;border:0;border-radius:5px;background:#3b3d2c;color:white;padding:11px 15px;font-weight:600}button.secondary{background:#8f5233}input,textarea,select{width:100%;border:1px solid #cfc2ae;background:#faf6ef;border-radius:5px;padding:10px;font:inherit}label{display:block;margin:12px 0 6px;font-size:13px;font-weight:600}textarea{min-height:70px;resize:vertical}.draft{padding:12px;border-bottom:1px solid #d9cbb3;cursor:pointer}.draft:hover{background:#e7dcc8}.meta{font-size:12px;color:#5c5245}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.preview img{width:100%;border:1px solid #d9cbb3}.actions{display:flex;gap:10px;flex-wrap:wrap}#notice{min-height:20px;color:#8f5233}a{color:#8f5233}@media(max-width:760px){main{grid-template-columns:1fr}.preview{grid-template-columns:repeat(2,1fr)}} </style></head>
<body><header><small>MOOLRESHA / INTERNAL TOOL</small><h1>Content Studio</h1><p>Closer to the Root · Draft and review before publishing</p></header>
<main><section><h2>New content</h2><label for="starter">Editorial starting point</label><select id="starter"></select><button id="create" style="margin-top:12px">Create draft</button><h2>Draft queue</h2><div id="queue"></div></section><section><h2 id="heading">Select a draft</h2><p id="notice"></p><div id="editor" hidden><label>Title<input id="title"></label><label>Hook<input id="hook"></label><div id="slides"></div><label>Caption<textarea id="caption"></textarea></label><label>Sources (one HTTPS URL per line)<textarea id="sources"></textarea></label><div class="actions"><button id="save">Save changes</button><button id="approve" class="secondary">Approve</button><button id="reject" class="secondary">Reject</button></div><div class="preview" id="preview"></div><p class="meta">SVG preview uses local brand colours and fallback fonts. Verify all claims before approval. No publishing is configured.</p></div></section></main>
<script>
let drafts=[],topics=[],selected=null;const $=id=>document.getElementById(id);
async function api(path,method='GET',data){const res=await fetch('/api/'+path,{method,headers:{'content-type':'application/json'},body:data?JSON.stringify(data):undefined});const json=await res.json();if(!res.ok)throw Error(json.error);return json}
function say(t){$('notice').textContent=t}
async function refresh(){drafts=await api('drafts');$('queue').replaceChildren(...drafts.map(d=>{const el=document.createElement('div');el.className='draft';el.textContent=d.title+' ('+d.status+')';el.onclick=()=>openDraft(d.id);return el}));if(selected)openDraft(selected)}
function openDraft(id){const d=drafts.find(x=>x.id===id);if(!d)return;selected=id;$('editor').hidden=false;$('heading').textContent=d.title;$('title').value=d.title;$('hook').value=d.hook;$('caption').value=d.caption;$('sources').value=d.sources.join('\n');$('slides').replaceChildren(...d.slides.map((s,i)=>{const box=document.createElement('div');const l=document.createElement('label');l.textContent='Slide '+(i+1);const t=document.createElement('textarea');t.value=s;t.dataset.slide=i;l.append(t);box.append(l);return box}));$('preview').replaceChildren(...d.slides.map((_,i)=>{const a=document.createElement('a');a.href='/api/drafts/'+id+'/slide/'+i;a.download='moolresha-slide-'+(i+1)+'.svg';const img=document.createElement('img');img.src=a.href+'?t='+Date.now();img.alt='Slide '+(i+1);a.append(img);return a}));$('approve').disabled=d.status!=='draft';$('save').disabled=d.status!=='draft';say('Status: '+d.status)}
$('create').onclick=async()=>{try{const d=await api('drafts','POST',topics[Number($('starter').value)]);selected=d.id;await refresh()}catch(e){say(e.message)}};
$('save').onclick=async()=>{try{await api('drafts/'+selected,'PATCH',{title:$('title').value,hook:$('hook').value,caption:$('caption').value,slides:[...document.querySelectorAll('[data-slide]')].map(x=>x.value),sources:$('sources').value.split('\n').map(x=>x.trim()).filter(Boolean)});await refresh();say('Saved')}catch(e){say(e.message)}};
$('approve').onclick=async()=>{if(!confirm('Have you manually verified all factual claims and source links?'))return;try{await api('drafts/'+selected+'/approve','POST');await refresh()}catch(e){say(e.message)}};
$('reject').onclick=async()=>{try{await api('drafts/'+selected+'/reject','POST');await refresh()}catch(e){say(e.message)}};
(async()=>{topics=await api('topics');$('starter').replaceChildren(...topics.map((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t.title;return o}));await refresh()})().catch(e=>say(e.message));
</script></body></html>
