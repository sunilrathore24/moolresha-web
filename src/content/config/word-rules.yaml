# Editable word rules used by the Content_Check (design: Data Models).
# Schema: src/lib/word-rules-schema.ts. Edit the lists, no code change needed.

# CC-03: allowed only inside a .fact whose fact lists the word in `substantiates`.
restricted:
  - "sustainable"
  - "eco"
  - "eco-friendly"
  - "green"
  - "planet-friendly"
  - "conscious"

# CC-10: tone words (whole word, case-insensitive).
superlatives:
  - "best"
  - "premium"
  - "luxury"
  - "amazing"

# CC-09: exact strings allowed outside a .fact even though they contain a
# number sign. Empty at launch; add an entry only with a reason.
numericAllow: []

# Restricted_Phrase_List (Requirement 11A.6, CC-17): allowed only wholly
# inside a .fact with a source.
restrictedPhrases:
  - "made in Bangladesh"
  - "instead of Bangladesh"
  - "less GST"

# Health_Term_List (Requirement 8C.11, CC-20): banned everywhere.
healthTerms:
  - "skin-friendly"
  - "hypoallergenic"
  - "anti-allergy"
  - "chemical-free"
  - "non-toxic"
  - "hypo-allergenic" # proposed extra spelling, ⚠️ confirm

# CC-02: fact ids allowed to stay unverified on a published page. Founder-approved launch
# exception, added 2026-11-11, to be removed once each entry below is sourced (or, for the
# microfibre study, independently replicated):
#   - journey-field, journey-ginning, journey-weaving, journey-processing,
#     why-softness-easy-care: generic "MoolResha estimate" process descriptions with no
#     external source attached yet.
#   - beyond-polyester-microfibre-shedding: kept unverified on purpose per its own note (a
#     single commissioned study, not yet independently replicated).
# Every other fact referenced by a published page must still pass CC-02 normally — this list
# does not weaken the rule for anything not named here. Empty at launch; add an entry only
# with a reason.
launchExceptions:
  - "journey-field"
  - "journey-ginning"
  - "journey-weaving"
  - "journey-processing"
  - "why-softness-easy-care"
  - "beyond-polyester-microfibre-shedding"
