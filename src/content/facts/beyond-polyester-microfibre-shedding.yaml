id: beyond-polyester-microfibre-shedding
label: FACT
text: "A study commissioned by the Changing Markets Foundation, testing garments from five major fashion brands, found that recycled polyester released about 55% more microfibres on washing than virgin polyester, and that the particles it shed were smaller, making them travel further."
